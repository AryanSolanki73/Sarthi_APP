name: sarthi_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^2.0.0

  # Campus Map
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Firebase & Authentication
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^6.2.2

  # Storage & Utilities
  path_provider: ^2.1.6
  flutter_web_plugins:
    sdk: flutter
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
